s:50%;text-align:center;padding:7px;color:#f3d9a6;background:#393046}.node.dim{border-color:#69647d;color:#a8a6bb}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:#8f92ab;font-size:12px;font-weight:600;padding:16px;border-bottom:1px solid #373650}.table td{padding:18px 16px;border-bottom:1px solid #333149}.assistant{position:fixed;right:25px;bottom:24px;z-index:30;display:flex;align-items:end;gap:10px;filter:drop-shadow(0 8px 18px #0007)}.mascot{width:91px;height:105px;border-radius:44% 44% 38% 38%;background:linear-gradient(155deg,#83caff,#397ad3 65%,#2c5099);border:3px solid #b4e3ff;position:relative;box-shadow:0 0 0 5px #171b31}.mascot:before,.mascot:after{content:'';position:absolute;background:#4f91e6;top:-17px;width:24px;height:32px;border:3px solid #b4e3ff}.mascot:before{left:8px;transform:rotate(-25deg);border-radius:5px 24px 5px 8px}.mascot:after{right:8px;transform:rotate(25deg);border-radius:24px 5px 8px 5px}.eyes{position:absolute;top:33px;left:18px;right:18px;display:flex;justify-content:space-between}.eye{width:19px;height:25px;border-radius:50%;background:white;position:relative}.eye:after{content:'';position:absolute;width:10px;height:13px;background:#0e2249;top:7px;left:7px;border-radius:50%}.nose{position:absolute;top:68px;left:40px;width:12px;height:8px;border-radius:50%;background:#192b50}.assistant.mini .mascot{height:53px;border-radius:40px 40px 14px 14px;overflow:visible}.assistant.mini .mascot .eyes{top:19px}.assistant.mini .nose{display:none}.bubble{width:260px;background:#252343;border:1px solid #b89d6d;border-radius:17px;padding:15px;line-height:1.6;font-size:13px}.bubble strong{color:#f5ca80}.assistant.mini .bubble{display:none}.toggle-assistant{position:fixed;right:22px;top:17px;z-index:60;border-radius:14px;background:#26243b;border:1px solid #584f6a;padding:8px;color:#d2c7dc;font-size:12px}.toggle-assistant button{border:0;background:#494061;color:#fff;padding:5px 10px;border-radius:8px;margin-left:8px}.fullch </style></head><body><div class="shell"><aside class="sidebar"><div class="brand">◖ JazzVerse<br><span> Piano</span><small>PLAY • LEARN • IMPROVISE</small></div><nav class="nav" id="nav"></nav><div class="side-bottom"><strong>YOUR JAZZ JOURNEY</strong><div style="margin:9px 0 13px;color:#d0cbdc">Practice with intention. Learn to play what you hear.</div><div class="bar"><div style="width:64%"></div></div><div style="margin-top:8px;color:#b9b5c9">Level 03 · 64% complete</div></div></aside><main><div class="topbar"><div class="kicker">✦ THE AI-POWERED PIANO ACADEMY</div><div class="user"><span class="badge">♬ 12-day streak</span><span class="muted">⌕　♧</span><span class="avatar">AC</span></div></div><div id="content"></div></main></div><div class="toggle-assistant">AI Companion <button onclick="switchMascot()" id="assistantToggle">Eyes only</button></div><div class="assistant" id="assistant"><div class="bubble"><strong>Hey, Alex!</strong><br>Ready for your next jazz session? Let's make it swing.</div><div class="mascot"><div class="eyes"><i class="eye"></i><i class="eye"></i></div><div class="nose"></div></div></div><script>
const navs=[['home','⌂','Discover'],['courses','▤','My Courses'],['course-detail','▣','Course Detail'],['lesson','♫','Interactive Lesson'],['notation','𝄞','Notation & Practice'],['coach','✦','AI Coach'],['challenges','♛','Challenges'],['progress','◫','My Progress'],['library','♬','Repertoire'],['profile','⚙','Profile & Settings']];
const st=()=>`<div class="staff"><div class="staff-labels"><span>Dm7</span><span>G7</span><span>Cmaj7</span></div><div class="staff-lines"><div class="staff-notes">♩ ♫ ♩ ♫</div></div></div>`;
const keyboard=()=>`<div class="roll"><div class="note" style="left:17%;top:10px;height:107px"></div><div class="note blue" style="left:36%;top:42px;height:80px"></div><div class="note" style="left:52%;top:4px;height:110px"></div><div class="note blue" style="left:75%;top:35px;height:74px"></div><div class="note" style="left:85%;top:-16px;height:80px"></div><div class="keys">${Array.from({length:24},(_,i)=>`<div class="key ${[4,9,17].includes(i)?'lit':''} ${i===17?'blue':''}"></div>`).join('')}</div></div>`;
const courseCards=()=>`<div class="grid g4">${[['Jazz Foundations','24 lessons · Jazz','jazz'],['Classical Essentials','18 lessons · Classical','classical'],['Blues Piano Basics','20 lessons · Blues','blues'],['Soul & Gospel','16 lessons · Gospel','gospel']].map(x=>`<div class="course course-tile"><span class="tag">${x[2].toUpperCase()}</span><div style="flex:1"></div><strong>${x[0]}</strong><small>${x[1]}</small></div>`).join('')}</div>`;
const pages={
'home':()=>`<div class="hero"><div class="eyebrow">FEATURED LEARNING PATH</div><h1>The Complete<br><em>Jazz Piano Journey</em></h1><p>A cinematic, interactive piano academy. Watch the lesson, play the real keys, and let your AI coach guide your progress.</p><button class="button" onclick="go('course-detail')">Continue Journey →</button> <button class="button secondary" onclick="go('courses')">Explore Courses</button></div><h2 class="section">Explore by genre</h2><div class="grid g4">${['Jazz','Classical','Blues','Soul / Gospel'].map((g,i)=>`<div class="course"><strong>${g}</strong><small>${['Improvisation and harmony','Technique and repertoire','Groove and expression','Rich voicings and feel'][i]}</small></div>`).join('')}</div><h2 class="section">Continue learning <span class="muted" style="font-size:12px;float:right">VIEW ALL →</span></h2><div class="grid g3"><div class="card"><div class="eyebrow">YOUR NEXT LESSON</div><h3>II–V–I Jazz Comping</h3><p class="sub">Lesson 6 of 24 · Intermediate</p><div class="bar"><div style="width:45%"></div></div><p><button class="button" onclick="go('lesson')">Resume lesson →</button></p></div><div class="card"><div class="eyebrow">PERSONAL RECOMMENDATION</div><h3>Rootless Voicings</h3><p class="sub">Recommended based on your chord accuracy</p><div style="font-size:48px;color:#c5a2ea">♬</div></div><div class="card"><div class="eyebrow">DAILY CHALLENGE</div><h3>Comping Groove</h3><p class="sub">Earn points while building a real swing feel</p><button class="button secondary" onclick="go('challenges')">Start challenge →</button></div></div>`,
'courses':()=>`<div class="eyebrow">THE LEARNING LIBRARY</div><h1 class="heading">Courses that feel like a great series.</h1><p class="sub">Curated instruction across jazz, classical, blues, gospel, soul, and contemporary piano.</p><div class="tabs"><button class="sel">All styles</button><button>Jazz</button><button>Classical</button><button>Blues</button><button>Soul / Gospel</button><button>Pop</button></div>${courseCards()}<h2 class="section">Your personal curriculum</h2><div class="grid g3"><div class="card"><div class="eyebrow">01 · IN PROGRESS</div><h3>Jazz Piano Fundamentals</h3><p class="sub">Foundations, harmony and standards</p><button class="button" onclick="go('course-detail')">Open course →</button></div><div class="card"><div class="eyebrow">02 · RECOMMENDED</div><h3>Rhythm & Swing</h3><p class="sub">Learn to groove with a rhythm section</p></div><div class="card"><div class="eyebrow">03 · COMING NEXT</div><h3>Improvisation Basics</h3><p class="sub">Motifs, guide tones and melodic phrasing</p></div></div>`,
'course-detail':()=>`<div class="eyebrow">COURSE DETAILS / JAZZ</div><div class="two-col"><div><div class="hero" style="min-height:345px"><div class="tag">BEGINNER → INTERMEDIATE</div><h1 style="font-size:43px">Jazz Piano<br>Fundamentals</h1><p>A complete pathway into jazz voicings, progressions, comping and your first solos.</p><button class="button" onclick="go('lesson')">Continue Course →</button></div><h2 class="section">Meet your instructor</h2><div class="card profile-card"><div class="large-avatar">♫</div><div><h3>Marcus Clark · Jazz Pianist</h3><div class="sub">Lessons filmed by a real teacher, enhanced by guided practice and contextual AI.</div></div></div></div><div><div class="card"><h3>Learning outcomes</h3>${['Understand essential jazz harmonies','Play shell and rootless voicings','Comp through a 12-bar blues','Improvise on simple progressions','Perform three complete standards'].map(x=>`<div class="listrow"><span>✓　${x}</span></div>`).join('')}</div><div class="card" style="margin-top:18px"><h3>Course content · 24 lessons</h3>${['01 · Jazz foundations','02 · Chords & Voicings','03 · The II–V–I Progression','04 · Swing Comping','05 · First Improvisation','06 · Play your first standard'].map((x,i)=>`<div class="listrow"><span>${x}</span><span class="muted">${i===0?'4 lessons':'3 lessons'}　›</span></div>`).join('')}</div></div></div>`,
'lesson':()=>`<div class="eyebrow">JAZZ FOUNDATIONS / LESSON 06</div><h1 class="heading">II–V–I Comping in Jazz</h1><p class="sub">Watch → understand → play along → get targeted feedback. Connect a MIDI keyboard for real input.</p><div class="preview-note">DESIGN PREVIEW · Video, metrics and notes are illustrative; these controls are not yet connected to a real piano.</div><div class="layout-player"><div class="card" style="padding:14px"><h3>Lesson steps</h3>${['Watch & learn','Guided practice','Play along','Loop & refine','AI check-in'].map((x,i)=>`<div class="step ${i<2?'done':i===2?'active':''}">${x}</div>`).join('')}<div class="div"></div><div class="sub">Today's focus<br><strong style="color:#f0d099">Voice leading & groove</strong></div></div><div><div class="grid g2" style="grid-template-columns:1.16fr .84fr;gap:13px"><div class="video"><div class="pianist">🎹</div><div class="play-circle">▶</div><div class="video-footer"><span>3:24 / 8:16</span><span>CC　⛶</span></div></div><div class="card" style="padding:12px"><div class="eyebrow">LIVE MUSIC NOTATION</div><p>Jazz Comping: ii–V–I in C</p>${st()}<div class="sub" style="margin-top:11px">♬ Sheet music synchronized with the video</div></div></div>${keyboard()}<div class="card" style="margin-top:12px;padding:12px;display:flex;justify-content:space-between;align-items:center"><span>▶　❚❚　 1:42 / 4:20</span><span style="color:#d8c18a">A ◂━━━━━━━▸ B</span><span>0.75×　 1.0×　 ⚙　⛶</span></div></div><div class="card"><h3>Your performance</h3><div class="score">92% <span style="font-size:13px;color:#dbd1e0">Accuracy</span></div><div class="metric"><span>Combo</span><strong>×28</strong></div><div class="metric"><span>Score</span><strong>18,430</strong></div>${[['Timing',94],['Notes',92],['Rhythm',90]].map(x=>`<p>${x[0]} <span style="float:right">${x[1]}%</span></p><div class="bar"><div style="width:${x[1]}%"></div></div>`).join('')}<div class="div"></div><h3>Practice controls</h3><div class="listrow">Tempo <b>−　80 BPM　+</b></div><div class="listrow">Loop section <b>Bars 5–8</b></div><div class="listrow">Visualization <b>Hybrid</b></div><button class="button secondary" style="width:100%;margin-top:13px" onclick="go('coach')">Ask your AI Coach ✦</button></div></div>`,
'notation':()=>`<div class="eyebrow">PRACTICE PLAYER / DISPLAY MODES</div><h1 class="heading">Your music, your learning style.</h1><p class="sub">Play from falling notes, traditional score, or both. Each mode follows the same musical timeline.</p><div class="split-tabs"><button>Falling notes</button><button>Sheet music</button><button class="sel">Hybrid ✓</button></div><div class="two-col"><div class="card"><h3>Hybrid playback · ii–V–I in C major</h3><div style="margin:16px 0">${st()}</div>${keyboard()}<div class="card-head" style="margin-top:18px"><span>⏵　0:43 / 2:00</span><span class="muted">72 BPM　·　C major　·　Loop: ON</span></div></div><div class="card"><h3>Learn to read while you play</h3><p class="sub">Assistive visual cues fade as students improve, strengthening real music-reading skill.</p>${['Show note names','Color left and right hand','Highlight next chord','Display finger numbers','Adaptive assistance'].map((x,i)=>`<div class="listrow"><span>${x}</span><span style="color:${i===4?'#b1e9c9':'#e9cc91'}">${i===4?'AUTO':'ON'}</span></div>`).join('')}<div class="div"></div><div class="eyebrow">UPCOMING CHORD</div><div class="score" style="font-size:28px">G7 → Cmaj7</div><p class="sub">Resolve guide tones smoothly.</p></div></div>`,
'coach':()=>`<div class="eyebrow">PERSONAL MUSIC INTELLIGENCE</div><h1 class="heading">Meet your AI piano coach.</h1><p class="sub">The coach normally lives in the bottom-right corner in Eyes-only or Full mascot mode. This page shows the expanded conversation and learning insights.</p><div class="two-col"><div class="card"><div class="card-head"><h3>✦ Coach conversation</h3><span class="badge">Context: II–V–I Lesson 06</span></div><div class="chat-bubble userchat">Why do my chord transitions still sound uneven?</div><div class="chat-bubble"><strong style="color:#f3ca80">Milo · AI Piano Coach</strong><p>In your last practice, the notes were mostly correct, but your G7 arrived late in measures 3 and 7. Let's try playing just the guide tones at 60 BPM, then increase the tempo gradually.</p><div class="tag">Generate 5-minute exercise</div></div><div class="chat-bubble userchat">Can you show a smoother voicing?</div><div class="chat-bubble">Yes. Try Dm7 (F–C), G7 (F–B), Cmaj7 (E–B). Notice how little the voices move. Let's practice that transition slowly.</div><input class="search" value="Ask Milo about your playing…" readonly style="margin-top:15px"></div><div class="card"><h3>Assistant display modes</h3><div class="inset"><strong>Eyes only</strong><p class="sub">Only the eyes and ears peek above the edge. Minimal distraction while playing.</p><div style="font-size:44px">◉ ◉</div></div><div class="inset" style="margin-top:13px"><strong>Full character</strong><p class="sub">The small mascot appears with optional feedback bubbles and voice playback.</p><div style="font-size:42px">✦ ♫</div></div><div class="div"></div><strong>Privacy and control</strong><p class="sub">Mute voice, hide assistant, choose text only, and control microphone access.</p></div></div>`,
'challenges':()=>`<div class="eyebrow">GAMEPLAY & MEASURABLE PRACTICE</div><h1 class="heading">Practice with purpose.</h1><p class="sub">Reward improvement, timing and consistency — not just button-mashing or arbitrary points.</p><div class="two-col"><div class="card" style="min-height:330px;background:linear-gradient(125deg,#392746,#15172e)"><div class="card-head"><div class="tag">DAILY CHALLENGE</div><span class="badge">12-day streak</span></div><div class="row"><div class="challenge-trophy">🏆</div><div><h2 style="font:32px Georgia,serif">Swing Comping Challenge</h2><p class="sub">Keep a steady pulse through a 12-bar jazz progression.</p><div class="score">27,860 <span style="font-size:14px;color:#f9dfad">PTS</span></div></div></div><button class="button" onclick="go('lesson')">Start Challenge →</button></div><div class="grid g2"><div class="card"><h3>Accuracy</h3><div class="score">94%</div><p class="sub">Best run this week</p></div><div class="card"><h3>Combo</h3><div class="score">×56</div><p class="sub">Consecutive correct changes</p></div><div class="card"><h3>Time on task</h3><div class="score">24m</div><p class="sub">Focused practice today</p></div><div class="card"><h3>New skill</h3><div class="score" style="font-size:20px">Guide tones</div><p class="sub">Unlocked exercise series</p></div></div></div><h2 class="section">Achievements</h2><div class="grid g4">${['First jazz lesson','Seven-day practice streak','Timing master','Voicing explorer'].map((x,i)=>`<div class="card"><div style="font-size:35px;color:#e7c486">${['✦','♛','◷','♬'][i]}</div><h3>${x}</h3><p class="sub">Earned through demonstrated practice</p></div>`).join('')}</div>`,
'progress':()=>`<div class="eyebrow">PERSONALIZED LEARNING ANALYTICS</div><h1 class="heading">Your progress, beyond a high score.</h1><p class="sub">Skill development, repertoire mastery, and time spent practicing deliberately.</p><div class="progress-grid"><div class="card"><div class="card-head"><h3>Jazz skill tree</h3><span class="tag">LEVEL 03</span></div><div class="tree"><div class="node">Harmony<br>72%</div><div class="node">Voicings<br>48%</div><div class="node dim">Improvisation<br>29%</div></div><div class="tree"><div class="node">Swing<br>63%</div><div class="node">Ear Training<br>55%</div><div class="node dim">Jazz Standards<br>38%</div></div></div><div class="card"><div class="card-head"><h3>Weekly practice</h3><span class="badge">+28% this week</span></div><div class="small-stat">4h 36m</div><div class="sparkline">${[38,68,54,85,66,90,59].map(h=>`<i style="height:${h}%"></i>`).join('')}</div><div style="display:flex;justify-content:space-between;color:#979ab5;font-size:11px;margin-top:9px"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div></div><div class="card"><h3>Learning outcomes</h3>${[['Sight-reading',44],['Jazz harmony',72],['Improvisation',29],['Comping',61]].map(x=>`<p>${x[0]} <span style="float:right">${x[1]}%</span></p><div class="bar"><div style="width:${x[1]}%"></div></div>`).join('')}</div><div class="card"><h3>AI practice recommendation</h3><p class="sub" style="font-size:15px">Your harmonic understanding is improving faster than your improvisational fluency.</p><p>Focus on guide-tone solos over Dm7 → G7 → Cmaj7.</p><button class="button" onclick="go('lesson')">Start 10-minute practice →</button></div></div>`,
'library':()=>`<div class="eyebrow">YOUR REPERTOIRE</div><h1 class="heading">Explore. Learn. Perform.</h1><p class="sub">Lead sheets, interactive practice and guided play-alongs across different musical styles.</p><div class="card"><div class="card-head"><h3>Standards & song library</h3><span class="badge">Jazz highlighted</span></div><div class="tabs"><button class="sel">Jazz Standards</button><button>Classical</button><button>Blues</button><button>Gospel</button><button>Pop</button></div><input class="search" placeholder="Search songs, composers, chords or difficulty…"><table class="table"><thead><tr><th>COMPOSITION</th><th>STYLE</th><th>LEVEL</th><th>ACTION</th></tr></thead><tbody>${[['Autumn Leaves','Jazz Standard','Intermediate'],['Blue Bossa','Latin Jazz','Beginner'],['All the Things You Are','Jazz Standard','Advanced'],["Take the A Train",'Swing','Intermediate'],['Misty','Jazz Ballad','Intermediate'],['12-bar Blues in F','Blues','Beginner']].map(x=>`<tr><td><strong>${x[0]}</strong></td><td>${x[1]}</td><td><span class="tag">${x[2]}</span></td><td><button class="button secondary" onclick="go('notation')">Practice →</button></td></tr>`).join('')}</tbody></table></div><p class="footnote">Content and public-domain/licensed repertoire must be curated before production.</p>`,
'profile':()=>`<div class="eyebrow">ACCOUNT & LEARNING PREFERENCES</div><h1 class="heading">Your piano journey.</h1><div class="two-col"><div><div class="card profile-card"><div class="large-avatar">AC</div><div><h2>Alex Chen</h2><p class="sub">Jazz learner · Level 03 · Pro membership</p><span class="tag">12-DAY PRACTICE STREAK</span></div></div><div class="card" style="margin-top:18px"><h3>Learning plan & goals</h3>${[['Play five jazz standards','2 / 5'],['Improve II–V–I voicings','In progress'],['Practice 30 minutes daily','12 days'],['Improvise over a 12-bar blues','Not started']].map(x=>`<div class="listrow"><span>✓　${x[0]}</span><span class="muted">${x[1]}</span></div>`).join('')}</div></div><div><div class="card"><h3>Instrument connection</h3><div class="device-status"><span><span class="dot"></span>Yamaha digital piano · MIDI</span><button class="button secondary">Manage</button></div><p class="sub">Use a supported MIDI device for precise note detection. Microphone mode is a later-phase feature.</p><div class="div"></div><h3>Companion preferences</h3><div class="listrow">Mascot appearance <span>Eyes only / Full</span></div><div class="listrow">Assistant voice <span>On / Off</span></div><div class="listrow">Practice reminders <span>On / Off</span></div><div class="listrow">Privacy controls <span>Manage →</span></div></div></div></div>`
};
let current=new URLSearchParams(location.search).get('screen')||'home';if(!pages[current])current='home';
function go(id){current=id;history.replaceState(null,'','?screen='+id);render()};function render(){document.getElementById('nav').innerHTML=navs.map(x=>`<button class="${current===x[0]?'active':''}" onclick="go('${x[0]}')"><span class="ni">${x[1]}</span>${x[2]}</button>`).join('');document.getElementById('content').innerHTML=pages[current]();}let mini=false;function switchMascot(){mini=!mini;document.getElementById('assistant').classList.toggle('mini',mini);document.getElementById('assistantToggle').textContent=mini?'Full mascot':'Eyes only'}render();
